name: Pi native artifacts

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: CI source run to promote (requires release_tag)
        required: false
        type: string
      release_tag:
        description: Existing pi-native version tag to publish (requires source_run_id)
        required: false
        type: string
      local_macos_release:
        description: Draft intake release for signed SSH-local macOS (requires both promotion inputs)
        required: false
        type: string
  push:
    branches: [feat/pi-native-identity, pi-bolt]
    tags: ["pi-native-v*"]

permissions:
  contents: read

concurrency:
  group: pi-native-artifacts-${{ github.event_name == 'workflow_dispatch' && (inputs.source_run_id != '' || inputs.release_tag != '') && format('promotion-{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: true

env:
  # Application update URLs may use the fork; the signed engine is always upstream's.
  PI_NATIVE_RUNTIME_TAG: bolt-v1.1.7
  PI_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  validate-inputs:
    if: github.repository == 'saifymatteo/Pi-Bolt'
    runs-on: ubuntu-latest
    steps:
      - name: Validate promotion inputs before any artifact downloads
        env:
          INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_LOCAL_MACOS_RELEASE: ${{ inputs.local_macos_release }}
        shell: bash
        run: |
          if [[ -n "$INPUT_SOURCE_RUN_ID" || -n "$INPUT_RELEASE_TAG" || -n "$INPUT_LOCAL_MACOS_RELEASE" ]]; then
            [[ -n "$INPUT_SOURCE_RUN_ID" && -n "$INPUT_RELEASE_TAG" ]] || { echo 'source_run_id and release_tag must be supplied together' >&2; exit 1; }
            [[ "$INPUT_SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'source_run_id must be decimal' >&2; exit 1; }
            version_tag='^pi-native-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
            [[ "$INPUT_RELEASE_TAG" =~ $version_tag ]] || { echo 'release_tag must be a valid pi-native version tag' >&2; exit 1; }
            if [[ -n "$INPUT_LOCAL_MACOS_RELEASE" ]]; then
              [[ "$INPUT_LOCAL_MACOS_RELEASE" =~ ^pi-native-local-macos-[A-Za-z0-9._-]+$ ]] || { echo 'invalid local macOS intake tag' >&2; exit 1; }
            fi
          fi

  artifacts:
    needs: validate-inputs
    if: github.repository == 'saifymatteo/Pi-Bolt' && !(github.event_name == 'workflow_dispatch' && inputs.source_run_id != '' && inputs.release_tag != '') && (github.ref == 'refs/heads/feat/pi-native-identity' || github.ref == 'refs/heads/pi-bolt' || startsWith(github.ref, 'refs/tags/pi-native-v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: win32-x64
          - runner: macos-15
            platform: darwin-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Native runner architecture
        run: node -e 'const p = process.platform + "-" + process.arch; if (p !== process.env.EXPECTED_PLATFORM) throw Error(p);'
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
      - name: macOS build tools
        if: runner.os == 'macOS'
        run: brew install bash xz
      - name: Signed upstream runtime (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/fetch-runtime.sh --version "$PI_NATIVE_RUNTIME_TAG"
      - name: Signed upstream runtime (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "https://github.com/opensec-git/Pi-Bolt/releases/download/$env:PI_NATIVE_RUNTIME_TAG"
          New-Item -ItemType Directory -Force .work\pi-native-runtime, .work\runtime | Out-Null
          foreach ($name in 'pi-bolt-runtime-win32-x64.zip', 'SHA256SUMS', 'SHA256SUMS.sig', 'RUNTIME_STAMP') {
            # Retry: the release CDN answers some requests with transient 504s.
            & curl.exe -fsSL --retry 4 --retry-delay 5 --retry-all-errors -o ".work\pi-native-runtime\$name" "$base/$name"
            if ($LASTEXITCODE -ne 0) { throw "could not download $name" }
          }
          & 'C:\Program Files\Git\usr\bin\openssl.exe' pkeyutl -verify -pubin -inkey keys\release.pub -rawin -in .work\pi-native-runtime\SHA256SUMS -sigfile .work\pi-native-runtime\SHA256SUMS.sig
          if ($LASTEXITCODE -ne 0) { throw 'runtime checksum signature does not verify' }
          $lines = Get-Content -LiteralPath .work\pi-native-runtime\SHA256SUMS
          foreach ($name in 'pi-bolt-runtime-win32-x64.zip', 'RUNTIME_STAMP') {
            $sum = (Get-FileHash ".work\pi-native-runtime\$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($lines -notcontains "$sum  $name") { throw "$name checksum mismatch" }
          }
          Expand-Archive .work\pi-native-runtime\pi-bolt-runtime-win32-x64.zip -DestinationPath .work\pi-native-runtime
          Copy-Item .work\pi-native-runtime\pi-bolt-runtime-win32-x64\bun.exe .work\runtime\bun.exe
          Copy-Item .work\pi-native-runtime\RUNTIME_STAMP .work\runtime\RUNTIME_STAMP
      - name: Require the downloaded adjacent stamp to match this engine
        # Never replace RUNTIME_STAMP with the expected value or skip on mismatch.
        run: node scripts/pi-native-runtime.mjs .work/runtime/RUNTIME_STAMP
      - name: Prepare Pi offline (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/prepare-pi.sh
      - name: Prepare Pi offline (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:offline
          exit $LASTEXITCODE
      - name: Workflow and packaging contracts
        run: |
          node --test scripts/pi-native-artifacts.test.mjs scripts/pi-native-provenance.test.mjs scripts/pi-native-local-build.test.mjs
          python scripts/pi-native-artifacts.test.py
          python scripts/pi-native-installer.test.py
      - name: Focused offline source regressions
        working-directory: packages/coding-agent
        run: >-
          node ../../node_modules/vitest/dist/cli.js --run
          test/config-pi-identity.test.ts test/herdr-extension.test.ts
          test/package-manager-cli-preflight.test.ts test/args.test.ts
          test/pi-bolt-install-method.test.ts test/pi-bolt-latest-version.test.ts
          test/pi-bolt-update-windows.test.ts test/pi-bolt-update-rollback.test.ts
          test/pi-bolt-update-environment.test.ts test/pi-bolt-installer.test.ts
          test/pi-bolt-jit-hint.test.ts test/pi-bolt-mise.test.ts
          test/pi-bolt-scoop.test.ts test/pi-bolt-homebrew.test.ts
          test/pi-bolt-launchers.test.ts test/pi-bolt-repair.test.ts
          test/pi-bolt-doctor.test.ts
      - name: Terminal submission regressions
        working-directory: packages/tui
        run: node --test test/terminal.test.ts
      - name: Build JIT-on Pi (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/build-pi.sh --jit on --out out/pi-native/runtime
      - name: Build JIT-on pi.exe (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & scripts\build-pi.ps1 -Jit on -Out out\pi-native\runtime
          exit $LASTEXITCODE
      - name: Expose only pi-bolt; keep native Pi and assets private
        run: python scripts/pi-native-artifacts.py launchers out/pi-native "$PI_NATIVE_PLATFORM"
        env:
          PI_NATIVE_PLATFORM: ${{ matrix.platform }}
      - name: Native Pi regression tests (Unix)
        if: runner.os != 'Windows'
        run: bash tests/pi/run.sh "$PWD/out/pi-native/runtime/pi"
      - name: Native Pi regression tests (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & tests\pi\run.ps1 (Resolve-Path out\pi-native\runtime\pi.exe).Path
          exit $LASTEXITCODE
      - name: Canonical identity, compiled image and adjacent runtime assets
        run: python scripts/pi-native-artifacts.py smoke out/pi-native
      - name: Archive the entire output with checksums and provenance
        run: python scripts/pi-native-artifacts.py archive out/pi-native "$PI_NATIVE_PLATFORM"
        env:
          PI_NATIVE_PLATFORM: ${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pi-native-${{ matrix.platform }}
          path: |
            out/pi-native-artifacts/*.tar.gz
            out/pi-native-artifacts/*.zip
            out/pi-native-artifacts/SHA256SUMS
            out/pi-native-artifacts/build-metadata.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # Tags publish this run; manual promotion reuses a verified run. Trial tags remain prereleases.
  release:
    if: >-
      !cancelled() && github.repository == 'saifymatteo/Pi-Bolt' && needs.validate-inputs.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.source_run_id != '' && inputs.release_tag != '') ||
      (startsWith(github.ref, 'refs/tags/pi-native-v') && needs.artifacts.result == 'success'))
    needs: [validate-inputs, artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id || github.run_id }}
      LOCAL_MACOS_RELEASE: ${{ inputs.local_macos_release }}
      RELEASE_MODE: ${{ inputs.local_macos_release != '' && 'local-macos' || (github.event_name == 'workflow_dispatch' && inputs.source_run_id != '' && inputs.release_tag != '' && 'promotion' || 'tag') }}
    steps:
      # The publisher helper may not exist in the older release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          path: release-source
          persist-credentials: false
      - name: Provenance validator regressions
        run: node --test scripts/pi-native-provenance.test.mjs scripts/pi-native-local-build.test.mjs
      - name: Record the immutable release source
        run: echo "RELEASE_SHA=$(git -C release-source rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Download source run metadata and all platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p stage/win32-x64 stage/darwin-arm64 stage/linux-x64
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > stage/source-run.json
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name pi-native-win32-x64 --dir stage/win32-x64
          if [[ -n "$LOCAL_MACOS_RELEASE" ]]; then
            draft_source="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$LOCAL_MACOS_RELEASE" --jq 'select(.draft == true) | .target_commitish')"
            [[ "$draft_source" == "$RELEASE_SHA" ]] || { echo 'macOS intake must be a draft at the release source commit' >&2; exit 1; }
            gh release download "$LOCAL_MACOS_RELEASE" --repo "$GITHUB_REPOSITORY" --dir stage/darwin-arm64 \
              --pattern pi-bolt-darwin-arm64-jit.tar.gz --pattern build-metadata.json --pattern build-metadata.json.sig
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?filter=all&per_page=100" > stage/source-jobs.json
          else
            gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name pi-native-darwin-arm64 --dir stage/darwin-arm64
          fi
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name pi-native-linux-x64 --dir stage/linux-x64
      - name: Validate source run and all platform provenance
        run: node scripts/pi-native-provenance.mjs stage/source-run.json stage release-source "$RELEASE_MODE"
      - name: Verify each archive against its checksums
        run: |
          (cd stage/win32-x64 && sha256sum -c SHA256SUMS)
          (cd stage/darwin-arm64 && sha256sum -c SHA256SUMS)
          (cd stage/linux-x64 && sha256sum -c SHA256SUMS)
      - name: Stage release assets
        run: |
          mkdir -p out/release
          cp stage/win32-x64/pi-bolt-win32-x64-jit.zip stage/darwin-arm64/pi-bolt-darwin-arm64-jit.tar.gz stage/linux-x64/pi-bolt-linux-x64-jit.tar.gz out/release/
          cp release-source/scripts/install/install.ps1 release-source/scripts/install/install.sh out/release/
          cp stage/win32-x64/build-metadata.json out/release/build-metadata-win32-x64.json
          cp stage/darwin-arm64/build-metadata.json out/release/build-metadata-darwin-arm64.json
          cp stage/linux-x64/build-metadata.json out/release/build-metadata-linux-x64.json
          if [[ -n "$LOCAL_MACOS_RELEASE" ]]; then
            cp stage/darwin-arm64/build-metadata.json.sig out/release/build-metadata-darwin-arm64.json.sig
          fi
          # The updater's fetchSignedSums reads the version from the first line, and the installers and archives by name.
          version="${RELEASE_TAG#pi-native-v}"
          {
            echo "# pi-bolt $version"
            (cd out/release && sha256sum install.ps1 install.sh pi-bolt-win32-x64-jit.zip pi-bolt-darwin-arm64-jit.tar.gz pi-bolt-linux-x64-jit.tar.gz build-metadata-*.json)
            if [[ -n "$LOCAL_MACOS_RELEASE" ]]; then
              (cd out/release && sha256sum build-metadata-darwin-arm64.json.sig)
            fi
          } > out/release/SHA256SUMS
      - name: Sign the checksums
        env:
          PI_NATIVE_RELEASE_KEY: ${{ secrets.PI_NATIVE_RELEASE_KEY }}
        run: |
          printf '%s' "$PI_NATIVE_RELEASE_KEY" > out/release-signing.key
          openssl pkeyutl -sign -rawin -in out/release/SHA256SUMS -inkey out/release-signing.key -out out/release/SHA256SUMS.sig
          rm out/release-signing.key
          # The executable's built-in key must take the signature: catch a key/step mismatch before publishing.
          openssl pkeyutl -verify -pubin -inkey release-source/keys/pi-native-release.pub -rawin -in out/release/SHA256SUMS -sigfile out/release/SHA256SUMS.sig
      - name: Publish the release at this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="out/release-notes.md"
          {
            echo "Pi-Bolt ($RELEASE_TAG): the compiled Pi replacement."
            echo ""
            echo "- Commit: $RELEASE_SHA"
            echo "- Source run: $SOURCE_RUN_ID"
            echo "- Publisher commit: $GITHUB_SHA"
            if [[ -n "$LOCAL_MACOS_RELEASE" ]]; then
              echo "- macOS provenance: SSH-local, authenticated by the maintainer's signed build record (not an Actions build)."
            fi
            echo "- Signed upstream engine: $PI_NATIVE_RUNTIME_TAG"
            echo ""
            echo "### Usage"
            echo ""
            echo '```sh'
            echo "# Linux x86-64 (glibc) or macOS Apple silicon:"
            echo 'sh install.sh'
            echo 'pi-bolt'
            echo "# Windows: run install.ps1 in PowerShell, then pi-bolt."
            echo '```'
            echo ""
            echo "Verify first: \`sha256sum -c SHA256SUMS\`."
            echo ""
            echo "### Known limitations"
            echo ""
            echo "- Unnotarized: macOS Gatekeeper may need System Settings > Privacy & Security > Open Anyway."
            echo "- Herdr session restore may relaunch Node Pi instead of this build."
          } > "$notes"
          # Trial tags stay prereleases; plain pi-native-v* tags are full releases marked Latest.
          flags=(--title "Pi-Bolt native $RELEASE_TAG" --notes-file "$notes" --verify-tag)
          case "$RELEASE_TAG" in *-trial*) flags+=(--prerelease) ;; esac
          gh release create "$RELEASE_TAG" out/release/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"

